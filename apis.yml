name: Northwood Space
description: Northwood Space is an El Segundo, California ground-infrastructure company for the space
  industry, founded in 2022 by Bridgit Mendler (CEO), Griffin Cleverly (CTO), and Shaurya Luthra. It
  designs and delivers rapidly deployable satellite ground stations built on electronically steerable
  phased-array antennas that track many satellites at once with no moving parts, paired with software
  ("Portal") that orchestrates every contact, automates scheduling, and moves data from spacecraft to
  customer. Northwood aims to turn ground infrastructure into cloud-like, on-demand global capacity for
  defense and commercial operators. The company's software stack is described as developer-oriented with
  modern APIs and integration hooks, but it publishes no public developer portal, API documentation, or
  SDKs at this time. Backed by Andreessen Horowitz (a16z), Founders Fund, Washington Harbour Partners,
  and Alpine Space Ventures; raised a $100M Series B and won a $50M Space Force contract in early 2026.

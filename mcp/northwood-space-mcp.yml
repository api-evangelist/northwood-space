notes: >-
  Northwood's Redocly-hosted developer documentation site exposes a hosted Model Context Protocol server
  at https://docs.northwoodspace.io/mcp, advertised by the site's A2A agent card (capabilities.extensions)
  and by the OAuth protected-resource metadata at /.well-known/oauth-protected-resource/mcp. An anonymous
  JSON-RPC tools/list POST returned HTTP 401 {"error":"unauthorized","message":"Authentication required"}
  with WWW-Authenticate: Bearer resource_metadata="https://docs.northwoodspace.io/.well-known/oauth-protected-resource/mcp"
  (RFC 9728), so the live tool schema is auth-gated and is NOT recorded here. Sibling Redocly-hosted
  servers in the catalog (verato, spotnana, cpanel) enumerate the platform's documentation tools
  (list-apis, get-endpoints, get-endpoint-info, get-security-schemes, get-full-api-description, search);
  Northwood's tool list is not asserted because it was not observed. The underlying "Core API" reference
  the server would read is itself behind a Redocly corporate login.
server:
